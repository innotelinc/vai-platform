name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          # Config files location
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # The built-in GITHUB_TOKEN is enough here. It used not to be: the
          # `release` event this release creates is suppressed for events a
          # GITHUB_TOKEN makes, so `release-deployment.yml` never fired and the
          # repo carried a PAT just to get that trigger. That workflow now
          # triggers on `workflow_run` instead, which Actions emits itself and
          # does not suppress, so no PAT is required. RELEASE_PLEASE_TOKEN is
          # still honoured if set — it costs nothing and keeps an escape hatch.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}